<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refresher graph</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1f2328; --muted: #6a6f76; --line: #e3e0da;
    --item: #eef0f3; --item-line: #9aa3ad; --idea: #2f6f8f; --idea-soft: #d6e7ef;
    --person: #7a5ea8; --org: #5f7f4a; --source: #8a8f96;
    --fresh: #2e8b57; --fading: #c98a1b; --stale: #9aa0a6;
    --supersedes: #d0661f; --contradicts: #c0392b; --supports: #2e8b57; --elaborates: #3b74c4;
    --duplicates: #8a8f96; --soft-edge: #c9c5bd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181b; --panel: #1e2125; --ink: #e8e6e3; --muted: #9ba1a8; --line: #30343a;
      --item: #2a2e34; --item-line: #6c7480; --idea: #6fb3d6; --idea-soft: #23404f;
      --person: #b69ce0; --org: #9cc27f; --source: #8f959c; --soft-edge: #454a51;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181b; --panel: #1e2125; --ink: #e8e6e3; --muted: #9ba1a8; --line: #30343a;
    --item: #2a2e34; --item-line: #6c7480; --idea: #6fb3d6; --idea-soft: #23404f;
    --person: #b69ce0; --org: #9cc27f; --source: #8f959c; --soft-edge: #454a51;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 20px;
           align-items: baseline; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
  .filters label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1; min-width: 0; }
  aside { width: 360px; max-width: 42vw; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto;
          padding: 14px 16px; }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  aside ul { margin: 0; padding-left: 18px; }
  aside li { margin: 0 0 6px; }
  .kind { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; margin-right: 4px;
          border: 1px solid currentColor; }
  .fresh { color: var(--fresh); } .fading { color: var(--fading); } .stale { color: var(--stale); }
  .old { text-decoration: line-through; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; font-size: 13px; align-items: center; }
  .swatch { height: 3px; border-radius: 2px; }
  code { font-size: 12px; }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #cy { min-height: 60vh; }
    aside { width: auto; max-width: none; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Refresher graph</h1>
  <span class="meta" id="meta"></span>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div id="cy" role="img" aria-label="Graph of captured items, Ideas, people and sources"></div>
  <aside id="panel"></aside>
</main>
<script src="cytoscape.min.js"></script>
<script>
const DATA = /*GRAPH_DATA*/null;
const LIMIT = 150;  // nodes drawn before the rest are counted as hidden
const TYPES = {item: "Items", idea: "Ideas", person: "People", organization: "Organizations", source: "Sources"};
const RELATIONS = {
  SUPERSEDES: ["supersedes", "--supersedes"], CONTRADICTS: ["contradicts", "--contradicts"],
  SUPPORTS: ["confirms", "--supports"], ELABORATES: ["adds detail to", "--elaborates"],
  DUPLICATES: ["repeats", "--duplicates"], STATES: ["states", "--soft-edge"],
  AUTHORED_BY: ["by", "--soft-edge"], PUBLISHED_IN: ["in", "--soft-edge"], ABOUT: ["about", "--soft-edge"],
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  for (const kid of kids) node.append(kid);
  return node;
};
const short = (text, n = 48) => text.length > n ? text.slice(0, n - 1) + "…" : text;

// Keep the best-connected nodes when the graph is large; say how many are hidden.
const degree = {};
for (const e of DATA.edges) for (const end of [e.source, e.target]) degree[end] = (degree[end] || 0) + 1;
const ranked = [...DATA.nodes].sort((a, b) => (degree[b.id] || 0) - (degree[a.id] || 0));
const shown = new Set(ranked.slice(0, LIMIT).map(n => n.id));
const hidden = DATA.nodes.length - shown.size;
document.getElementById("meta").textContent =
  `${DATA.nodes.length} nodes, ${DATA.edges.length} edges · scored ${DATA.at.slice(0, 10)}` +
  (hidden ? ` · ${hidden} less connected nodes hidden` : "");

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [
    ...DATA.nodes.filter(n => shown.has(n.id)).map(n => ({data: {...n, short: short(n.label)}})),
    ...DATA.edges.filter(e => shown.has(e.source) && shown.has(e.target))
      .map((e, i) => ({data: {...e, id: `e${i}`, label: ["STATES", "AUTHORED_BY", "PUBLISHED_IN", "ABOUT"].includes(e.type) ? "" : RELATIONS[e.type][0]}})),
  ],
  wheelSensitivity: 0.25,
  style: [
    {selector: "node", style: {"label": "data(short)", "font-size": 10, "color": css("--ink"), "text-wrap": "wrap",
      "text-max-width": 120, "text-valign": "bottom", "text-margin-y": 4, "width": 14, "height": 14}},
    {selector: "node[type='item']", style: {"shape": "round-rectangle", "width": 22, "height": 16,
      "background-color": css("--item"), "border-width": 1.5, "border-color": css("--item-line")}},
    {selector: "node[type='item'][?unreviewed]", style: {"border-style": "dashed"}},
    {selector: "node[type='item'][?repost]", style: {"opacity": 0.6}},
    {selector: "node[type='idea']", style: {"width": "mapData(members, 1, 6, 18, 34)", "height": "mapData(members, 1, 6, 18, 34)",
      "background-color": css("--idea-soft"), "border-width": 3, "border-color": css("--stale")}},
    {selector: "node[type='idea'][status='firm']", style: {"background-color": css("--idea")}},
    {selector: "node[type='idea'][band='fresh']", style: {"border-color": css("--fresh")}},
    {selector: "node[type='idea'][band='fading']", style: {"border-color": css("--fading")}},
    {selector: "node[type='person']", style: {"background-color": css("--person")}},
    {selector: "node[type='organization']", style: {"shape": "diamond", "background-color": css("--org")}},
    {selector: "node[type='source']", style: {"shape": "hexagon", "background-color": css("--source")}},
    {selector: "edge", style: {"width": 1, "line-color": css("--soft-edge"), "curve-style": "bezier",
      "target-arrow-shape": "none", "label": "data(label)", "font-size": 9, "color": css("--muted"),
      "text-rotation": "autorotate", "text-background-color": css("--bg"), "text-background-opacity": 1,
      "text-background-padding": 1}},
    ...["SUPERSEDES", "CONTRADICTS", "SUPPORTS", "ELABORATES", "DUPLICATES"].map(t => ({selector: `edge[type='${t}']`,
      style: {"width": t === "DUPLICATES" ? 1.5 : 2.5, "line-color": css(RELATIONS[t][1]), "target-arrow-shape": "triangle",
              "target-arrow-color": css(RELATIONS[t][1]), "line-style": t === "DUPLICATES" ? "dashed" : "solid"}})),
    {selector: "edge[type='AUTHORED_BY'], edge[type='PUBLISHED_IN'], edge[type='ABOUT']", style: {"line-style": "dotted"}},
    {selector: ".faded", style: {"opacity": 0.12}},
    {selector: ":selected", style: {"border-width": 3, "border-color": css("--ink")}},
  ],
  layout: {name: "preset"},
});

// Filters: one checkbox per node type present, plus single-claim Ideas, which start hidden: each is one claim of
// one item, already listed in that item's panel, and drawn they turn a long list into a star.
const filters = document.getElementById("filters");
const visible = {};
function refilter() {
  cy.nodes().forEach(n => {
    const d = n.data();
    const on = visible[d.type] && !(d.type === "idea" && d.members < 2 && !visible.single);
    n.style("display", on ? "element" : "none");
  });
}
function toggle(key, name, checked) {
  const box = el("input", {type: "checkbox"});
  box.checked = visible[key] = checked;
  box.addEventListener("change", () => { visible[key] = box.checked; refilter(); });
  filters.append(el("label", {}, box, name));
}
for (const [type, name] of Object.entries(TYPES)) {
  if (DATA.nodes.some(n => n.type === type)) toggle(type, name, true);
}
const singles = DATA.nodes.filter(n => n.type === "idea" && n.members < 2).length;
if (singles) toggle("single", `Single-claim Ideas (${singles})`, false);
refilter();
cy.layout({name: "cose", animate: false, nodeRepulsion: 9000, idealEdgeLength: 70, padding: 24}).run();

const panel = document.getElementById("panel");
function legend() {
  panel.replaceChildren(el("h2", {}, "How to read it"),
    el("p", {}, "Rectangles are captured items, circles with a coloured ring are Ideas (claims answering the same question; filled when firm, ring shows freshness). Dashed items are unreviewed. Click a node or an arrow."),
    el("div", {class: "legend"}, ...["SUPERSEDES", "CONTRADICTS", "SUPPORTS", "ELABORATES", "DUPLICATES"].flatMap(t => [
      el("span", {class: "swatch", style: `background:${css(RELATIONS[t][1])}`}), el("span", {}, RELATIONS[t][0])])),
    el("p", {class: "meta"}, "Mentions are left out on purpose: shared names do not make two posts related."));
}
function claimList(rows) {
  return el("ul", {}, ...rows.map(c => el("li", {},
    el("span", {class: `chip ${c.band}`}, `${c.band} ${c.freshness}`),
    ...(c.noise ? [el("span", {class: "chip stale"}, "noise")] : []),
    el("span", {class: c.superseded ? "old" : ""}, c.statement),
    el("div", {class: "meta"}, c.item))));
}
function show(d) {
  const kids = [el("div", {class: "kind"}, d.type), el("h2", {}, d.label)];
  if (d.type === "idea") kids.push(el("p", {class: "meta"}, `${d.status} · ${d.members} claim(s) · current answer ${d.band}`));
  if (d.type === "item" && d.unreviewed) kids.push(el("p", {class: "meta"}, "Unreviewed: ingestion's quality gate has not passed."));
  if (d.type === "person") kids.push(el("p", {class: "meta"}, `Trust ${d.trust}`));
  if (d.chain && d.chain.length) kids.push(el("h3", {}, "What changed"),
    el("ul", {}, ...d.chain.map((s, i) => el("li", {class: i < d.chain.length - 1 ? "old" : ""}, s))));
  if (d.claims && d.claims.length) kids.push(el("h3", {}, "Claims"), claimList(d.claims));
  if (d.note) kids.push(el("h3", {}, "Obsidian note"), el("code", {}, `wiki/${d.note}.md`));
  panel.replaceChildren(...kids);
}
function showEdge(d) {
  const kids = [el("div", {class: "kind"}, d.type), el("h2", {}, RELATIONS[d.type][0])];
  if (d.said) kids.push(el("h3", {}, "Claim"), el("p", {}, d.said), el("h3", {}, RELATIONS[d.type][0]), el("p", {}, d.about));
  if (d.rationale) kids.push(el("h3", {}, "Why"), el("p", {}, d.rationale));
  panel.replaceChildren(...kids);
}
cy.on("tap", "node", evt => {
  const near = evt.target.closedNeighborhood();
  cy.elements().addClass("faded"); near.removeClass("faded");
  show(evt.target.data());
});
cy.on("tap", "edge", evt => { cy.elements().removeClass("faded"); showEdge(evt.target.data()); });
cy.on("tap", evt => { if (evt.target === cy) { cy.elements().removeClass("faded"); legend(); } });
legend();
</script>
</body>
</html>
