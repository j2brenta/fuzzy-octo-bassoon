<a class="skip" href="#brief">Skip to the brief</a>
<header class="app-bar">
<a class="app-brand" href="/" aria-label="Refresher home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 13A10 10 0 1 0 25 21M25 5v8h-8"/></svg>refresher<span class="dot">.</span><span class="page">Dossier</span></a>

    <nav class="toc" id="toc" aria-label="Sections of the dossier"></nav>
    <div id="sections"></div>
  </main>
  <aside class="pane" id="pane" aria-label="Map of this subject">
    <div class="pane-bar"><div><strong>The map of this subject</strong><span class="small quiet">Topics are regions, clusters dashed, people ◆. Pick anything for its evidence.</span></div>
      <button type="button" id="wide" aria-pressed="false">⤢ Wide map</button></div>
    <iframe id="atlas" src="/atlas/?embed=1&amp;mode=topics" title="Map of this subject: topics, clusters, people and evidence"></iframe>
  </aside>
</div>
