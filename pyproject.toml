[project]
name = "refresher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6", "aiogram>=3.31", "python-dotenv>=1.2"]

[project.scripts]
refresher = "refresher.cli:main"
refresher-seed-raw = "channels.seed_raw:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["refresher", "channels", "graph", "engine", "engine.parse", "store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
