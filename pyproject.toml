[project]
name = "refresher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6", "aiogram==3.31.0", "python-dotenv==1.2.4"]

[project.scripts]
refresher-import = "channels.importer:main"
refresher-seed-raw = "channels.seed_raw:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["refresher*", "channels*", "engine*", "store*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
