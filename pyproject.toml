[project]
name = "refresher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "aiogram==3.31.0",
    "python-dotenv==1.2.4",
    "trafilatura==2.3.1",
    "pillow>=11,<13",
    "pypdfium2>=5,<6",
    "numpy>=2",
]

[project.scripts]
refresher = "refresher.cli:main"
refresher-import = "channels.importer:main"
refresher-seed-raw = "channels.seed_raw:main"
refresher-view = "refresher.viewer:main"
refresher-mcp = "refresher.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["refresher*", "channels*", "engine*", "store*", "graph*"]

[tool.setuptools.package-data]
refresher = ["assets/*", "assets/map/*", "static/*.html", "static/*.css", "static/*.js", "static/brief/*.js", "static/topic/*.js", "static/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
web = ["pypdfium2>=4,<6"]
mcp = ["mcp==2.3.0"]  # refresher-mcp: the vault for other agents, read only
