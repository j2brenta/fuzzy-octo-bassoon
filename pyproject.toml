[project]
name = "refresher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml>=6"]

[project.scripts]
refresher = "refresher.cli:main"
refresher-import = "channels.importer:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["refresher", "channels", "graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
