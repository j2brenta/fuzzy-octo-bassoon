[project]
name = "newsmap-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
newsmap = "newsmap_sidecar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsmap_sidecar = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
